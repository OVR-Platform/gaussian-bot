[project]
name = "gaussian-robot"
version = "0.0.1"
description = "R&D: navigating robots inside Gaussian Splat scenes via VLM-driven perception."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Luca Simonetti", email = "lucasimonetti21@gmail.com" }]
keywords = ["gaussian-splatting", "robotics", "vlm", "navigation", "computer-vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Opt-in: splat rendering backends. Decide which one during R&D.
gsplat = [
    "torch>=2.2",
    "gsplat>=1.0",
]
# Opt-in: VLM clients
vlm = [
    "openai>=1.30",
    "httpx>=0.27",
]
# Opt-in: everything for development
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
gaussian-robot = "gaussian_robot.cli:app"

[project.urls]
Homepage = "https://github.com/lucasimonetti/gaussian-robot"
Repository = "https://github.com/lucasimonetti/gaussian-robot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_robot"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PL"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

# ---- Pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring a GPU",
]

# ---- Mypy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]
[[tool.mypy.overrides]]
module = ["gsplat.*", "torch.*"]
ignore_missing_imports = true
